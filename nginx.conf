server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web uses client-side routing - all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;

        # Desabilitar cache para o index.html e arquivos de configuração
        if ($uri = "/index.html") {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
        }
    }

    # Desabilitar cache especificamente para Service Worker e Manifest
    location ~* (service-worker\.js|flutter_service_worker\.js|manifest\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        access_log off;
    }

    # Cache para assets estáticos (imagens, fontes)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache para JS e CSS (com cuidado, pois main.dart.js é o coração do app)
    # Se você tiver problemas frequentes, pode diminuir para '1h' ou '0' durante testes
    location ~* \.(js|css)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
}
