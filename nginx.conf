server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html — nunca cachear (entry point do Flutter)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # main.dart.js, service worker e manifest — nunca cachear
    location ~* (main\.dart\.js|service-worker\.js|flutter_service_worker\.js|manifest\.json|version\.json|flutter_bootstrap\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Flutter web uses client-side routing - all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estáticos (imagens, fontes) — esses têm hash no nome
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache para outros JS/CSS (canvaskit, etc — têm hash no nome)
    location ~* \.(js|css)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
}
